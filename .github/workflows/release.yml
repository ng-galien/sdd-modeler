name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Publish core and plugin to mavenLocal
      run: ./gradlew :state-modeler-core:publishToMavenLocal :state-modeler-gradle-plugin:publishToMavenLocal

    - name: Build release artifacts
      run: ./gradlew build -x test
      
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## Changes
          
          See [CHANGELOG.md](./CHANGELOG.md) for details.
          
          ## Downloads
          
          - CLI JAR: `state-modeler-app-${{ steps.get_version.outputs.VERSION }}.jar`
          
          ## Usage
          
          ```bash
          java -jar state-modeler-app-${{ steps.get_version.outputs.VERSION }}.jar --help
          ```
        files: |
          state-modeler-app/build/libs/*.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}