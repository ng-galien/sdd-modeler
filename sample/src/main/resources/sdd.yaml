version: "1.0.0"
name: "lead-crm"
database:
  dialect: "postgres"
  schema: "public"
  generator_options:
    packageName: "com.example.leadcrm.domain"
    generateController: "true"
    generateMcp: "true"
    mcpProtocol: "SSE"
    mcpServerType: "SYNC"
entities:
  Lead:
    table: "leads"
    id:
      name: "id"
      type: "uuid"
    states:
      new:
        table: "leads_new"
        initial: true
        from: []
        from_any_of: []
        attributes:
          name:
            type: "TEXT"
          email:
            type: "TEXT"
          phone:
            type: "TEXT"
          source:
            type: "TEXT"
      contacted:
        table: "leads_contacted"
        from: ["new"]
        from_any_of: []
        attributes:
          contactedAt:
            type: "TIMESTAMP"
          contactedBy:
            type: "TEXT"
          notes:
            type: "TEXT"
      qualified:
        table: "leads_qualified"
        from: ["contacted"]
        from_any_of: []
        attributes:
          budget:
            type: "DECIMAL"
          timeline:
            type: "TEXT"
          qualificationNotes:
            type: "TEXT"
      converted:
        table: "leads_converted"
        from: ["qualified"]
        from_any_of: []
        attributes:
          convertedAt:
            type: "TIMESTAMP"
          contractValue:
            type: "DECIMAL"
          salesRepId:
            type: "TEXT"
