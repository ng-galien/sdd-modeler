services:
  postgres:
    image: postgres:16-alpine
    container_name: lead-crm-db
    environment:
      POSTGRES_DB: lead_crm
      POSTGRES_USER: lead_user
      POSTGRES_PASSWORD: lead_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_user -d lead_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
