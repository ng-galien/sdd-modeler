name: CI

permissions:
  checks: write
  pull-requests: write
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [ 21 ]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Spotless check
      run: ./gradlew spotlessCheck
      
    - name: Build with Gradle
      run: ./gradlew build
      
    - name: Run tests with coverage
      run: ./gradlew test jacocoAggregatedReport
      
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Test Results (Java ${{ matrix.java-version }})
        path: '**/build/test-results/test/TEST-*.xml'
        reporter: java-junit
        
    - name: Upload coverage reports
      if: matrix.java-version == '21'
      uses: codecov/codecov-action@v4
      with:
        files: ./build/reports/jacoco/jacocoAggregatedReport/jacocoAggregatedReport.xml
        fail_ci_if_error: false
        verbose: true

  # The `quality` job was merged into the `build` job so a single job does both build and checks.
      
