spring:
  application:
    name: lead-crm
  
  datasource:
    # Ensure JDBC client resolves unqualified table names against the `public_states` schema
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=public,public_states
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:changelog.yaml
    default-schema: public
    enabled: true
    contexts: default
  
  sql:
    init:
      mode: never

server:
  port: 8080

logging:
  level:
    com.example.leadcrm: DEBUG
    org.springframework.jdbc: DEBUG
