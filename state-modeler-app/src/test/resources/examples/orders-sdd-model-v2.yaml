version: 0.1
name: orders-sdd-example-v2

database:
  dialect: postgres
  schema: public

entities:
  order:
    table: orders
    id:
      name: id
      type: serial
      primary_key: true
    attributes:
      customer_id:
        type: int
        nullable: false
        description: "Référence vers le client"
      total_amount:
        type: numeric(12,2)
        nullable: false
      created_at:
        type: timestamptz
        default: now()

    states:
      pending:
        initial: true
        table: order_pending
        attributes:
          pending_reason:
            type: text
            nullable: false

      paid:
        from: [pending]
        table: order_paid
        attributes:
          payment_method:
            type: text
            nullable: false
          paid_amount:
            type: numeric(12,2)
            nullable: false

      cancelled:
        from_any_of: [pending, paid]
        table: order_cancelled
        attributes:
          cancel_reason:
            type: text
            nullable: false

      refunded:
        from: [paid]
        table: order_refunded
        attributes:
          refund_amount:
            type: numeric(12,2)
            nullable: false
          refund_method:
            type: text
            nullable: false

    extensions:
      paid_extensions:
        table: order_paid_extensions
        target_state: paid
        attributes:
          additional_notes:
            type: text
            nullable: true

      cancelled_extensions:
        table: order_cancelled_extensions
        target_state: cancelled
        attributes:
          admin_comments:
            type: text
            nullable: true

    projections:
      state_intervals:
        kind: intervals
        name: order_state_intervals
      current_state:
        kind: current_state
        name: current_order_states
